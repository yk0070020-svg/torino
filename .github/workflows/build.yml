name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable

      - name: Generate Android project
        run: flutter create --org com.torino --project-name torino --platforms android .

      - name: Add packages
        run: |
          flutter pub add supabase_flutter:^2.8.0 local_auth:^2.3.0
          cat pubspec.yaml

      - name: Patch Android (internet, biometric, screenshot block)
        run: |
          rm -rf test
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' $MANIFEST
          sed -i 's#android:label="[^"]*"#android:label="Torino"#' $MANIFEST
          F=$(find android/app/src/main/kotlin -name MainActivity.kt)
          PKG=$(grep '^package' $F)
          cat > $F <<EOF
          $PKG

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
              }
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: torino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
