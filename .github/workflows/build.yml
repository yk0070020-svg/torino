
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable

      - name: Generate Android project
        run: flutter create --org com.torino --project-name torino --platforms android .

      - name: Add packages
        run: |
          flutter pub add supabase_flutter:^2.8.0 local_auth:^2.3.0

      - name: Patch Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"

          grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' "$MANIFEST"

          sed -i 's#android:label="[^"]*"#android:label="Torino"#' "$MANIFEST"

      - name: Configure MainActivity
        run: |
          F=$(find android/app/src/main/kotlin -name MainActivity.kt -print -quit)

          if [ -z "$F" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PKG=$(grep '^package ' "$F" | head -n 1)

          cat > "$F" <<EOF
          $PKG

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: torino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
